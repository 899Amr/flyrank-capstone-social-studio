run: docker compose up --build
seed: docker compose exec api python -m app.seed
test: pytest -q
base_url: http://localhost:8000
endpoints:
  - GET /health
  - POST /tokens/{platform}
  - POST /campaigns
  - POST /campaigns/{campaign_id}/schedule
  - POST /campaigns/{campaign_id}/publish
  - POST /worker/run
  - POST /webhook/social-delivery
  - GET /campaigns/{campaign_id}

